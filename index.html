<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDG Cloud Engine v3.1</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. 앱 전체를 감싸는 래퍼 (Flexbox를 사용하여 좌우 분할) -->
    <div class="app-wrapper">
        
        <!-- 2. 왼쪽 사이드바 영역 -->
        <nav class="sidebar">
            <div class="logo">DG ASSISTANT</div>
            <ul class="menu-list">
    <li class="menu-item active" data-tab="dgDetail">
        <i class="icon-search"></i> IMDG 조회 (UNNO)
    </li>
    
    <li class="menu-item" data-tab="segCheck">
        <i class="icon-shield"></i> 격리규정 확인
    </li>
    
    <li class="menu-item" data-tab="notes">
        <i class="icon-edit"></i> DG추가정보노트
    </li>
</ul>
        </nav>

        <!-- 3. 오른쪽 메인 콘텐츠 영역 -->
        <main class="content-area">
            
            <!-- [탭 1] 격리규정 확인 (기존 기능) -->
            <!-- active 클래스가 있으므로 처음 접속 시 이 화면이 보입니다. -->
            <section id="tab-segregation" class="tab-content active">
                <div class="container">
                <header>
                    <h1>DG 격리여부 확인 <span>v3.1 (SKR/HAL)</span></h1>
                    <p class="subtitle">DG 격리 및 혼적 분석 시스템</p>
                </header>

                <div class="search-area">
                    <div class="search-wrap">
                        <input type="text" id="searchInput" placeholder="UN NUMBER를 입력하세요 (예 : 1993 3082)">
                        <button class="btn" id="addBtn">UNNO. 조회/추가</button>
                        <button class="btn secondary" id="clearBtn">초기화</button>
                    </div>
                    <div id="errorMsg"></div>
                </div>

                <div id="cardList"></div>
                <div id="segPanel"></div>
                </div>
            </section>

            <!-- [탭 2] DG정보 상세조회 (신규 기능) -->
            <section id="tab-lookup" class="tab-content">
                <div class="container">
                <header>
                    <h1>DG 정보 상세 조회 <span>Master Data</span></h1>
                    <p class="subtitle">UNNO 기반 화물 상세 규정 조회 (IMDG Code)</p>
                </header>
                
                <div class="search-area">
                    <div class="search-wrap">
                        <input type="text" id="lookupInput" placeholder="조회할 UNNO 4자리를 입력하세요 (예: 0030)">
                        <button class="btn accent2" id="infoLookupBtn">상세 정보 검색</button>
                    </div>
                    <div id="lookupErrorMsg"></div>
                </div>
                
                <!-- 검색 결과가 그리드 형태로 그려질 빈 공간입니다. -->
                <div id="infoDetailView"></div>
                </div>
            </section>

<section id="tab-notes" class="tab-content">
    <div class="container">
        <input type="hidden" id="editNoteId">
        <div class="search-area note-form">
            <div class="note-input-grid">
                <input type="text" id="noteTitle" placeholder="제목">
                <input type="text" id="noteAuthor" placeholder="작성자">
                <input type="password" id="notePw" placeholder="비밀번호 (수정/삭제용)">
            </div>
            <textarea id="noteContent" placeholder="내용을 입력하세요..." rows="4"></textarea>
            <div class="note-footer">
                <input type="file" id="noteFile">
                <div id="editStatus"></div> <button class="btn accent2" id="saveNoteBtn">노트 저장하기</button>
            </div>
        </div>

        <div id="noteList" class="note-grid"></div>
    </div>
</section>

<div id="noteModal" class="modal-overlay">
    <div class="modal-window">
        <div class="modal-header">
            <h2 id="modalTitle">제목</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-meta">
            <span id="modalAuthor">작성자</span> | <span id="modalDate">날짜</span>
        </div>
        <hr style="border:0; border-top:1px solid var(--border); margin:15px 0;">
        <div id="modalContent" class="modal-body">내용</div>
        <div id="modalAttachment" class="modal-foot"></div>
    </div>
</div>
</section>


        </main>

    <!-- 스크립트 연결은 항상 body가 끝나기 직전에 위치해야 DOM 로딩 에러를 방지합니다. -->
    
    <script src="app.js"></script>
</body>
</html>
