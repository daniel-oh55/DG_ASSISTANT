<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDG Cloud Engine v3.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&family=Plus+Jakarta+Sans:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 1. 앱 전체를 감싸는 래퍼 (Flexbox를 사용하여 좌우 분할) -->
    <div class="app-wrapper">
        
        <!-- 2. 왼쪽 사이드바 영역 -->
        <nav class="sidebar">
            <div class="logo">DG ASSISTANT</div>
            <ul class="menu-list">
                <!-- data-target 속성으로 어떤 탭을 열지 JS에게 알려줍니다. -->
                <li class="menu-item active" data-target="tab-segregation">📦 격리규정 확인</li>
                <li class="menu-item" data-target="tab-lookup">🔍 DG정보 상세조회</li>
            </ul>
        </nav>

        <!-- 3. 오른쪽 메인 콘텐츠 영역 -->
        <main class="content-area">
            
            <!-- [탭 1] 격리규정 확인 (기존 기능) -->
            <!-- active 클래스가 있으므로 처음 접속 시 이 화면이 보입니다. -->
            <section id="tab-segregation" class="tab-content active">
                <div class="container">
                <header>
                    <h1>DG 격리여부 확인 <span>v3.1 (SKR/HAL)</span></h1>
                    <p class="subtitle">DG 격리 및 혼적 분석 시스템</p>
                </header>

                <div class="search-area">
                    <div class="search-wrap">
                        <input type="text" id="searchInput" placeholder="UN NUMBER를 입력하세요 (예 : 1993 3082)">
                        <button class="btn" id="addBtn">UNNO. 조회</button>
                        <button class="btn secondary" id="clearBtn">초기화</button>
                    </div>
                    <div id="errorMsg"></div>
                </div>

                <div id="cardList"></div>
                <div id="segPanel"></div>
                </div>
            </section>

            <!-- [탭 2] DG정보 상세조회 (신규 기능) -->
            <section id="tab-lookup" class="tab-content">
                <div class="container">
                <header>
                    <h1>DG 정보 상세 조회 <span>Master Data</span></h1>
                    <p class="subtitle">UNNO 기반 화물 상세 규정 조회 (IMDG Code)</p>
                </header>
                
                <div class="search-area">
                    <div class="search-wrap">
                        <input type="text" id="lookupInput" placeholder="조회할 UNNO 4자리를 입력하세요 (예: 0030)">
                        <button class="btn accent2" id="infoLookupBtn">상세 정보 검색</button>
                    </div>
                    <div id="lookupErrorMsg"></div>
                </div>
                
                <!-- 검색 결과가 그리드 형태로 그려질 빈 공간입니다. -->
                <div id="infoDetailView"></div>
                </div>
            </section>

        </main>
    </div>

    <!-- 스크립트 연결은 항상 body가 끝나기 직전에 위치해야 DOM 로딩 에러를 방지합니다. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
